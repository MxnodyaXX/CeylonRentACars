<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="Ceylon Rent A Cars | Car Rental in Sri Lanka">

  <!-- Structured data: only verified details (name, website, logo) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://ceylonrentacars.com/#organization",
        "name": "Ceylon Rent A Cars",
        "url": "https://ceylonrentacars.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://ceylonrentacars.com/img/brand/logo-512.png",
          "width": 512,
          "height": 512
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://ceylonrentacars.com/#website",
        "name": "Ceylon Rent A Cars",
        "url": "https://ceylonrentacars.com/",
        "inLanguage": "en",
        "publisher": { "@id": "https://ceylonrentacars.com/#organization" }
      }
    ]
  }
  </script>

  <!-- Google tag (gtag.js) — present on every page so Google can detect it. Consent starts
       DENIED and the property is only configured after the visitor clicks Accept in the
       cookie banner (src/lib/analytics.js), so nothing is measured before consent. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    gtag('js', new Date());
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RT9GFSQY57"></script>

  <meta name="theme-color" content="#070708">
  <link rel="icon" href="/img/brand/icon-192.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/img/brand/logo-dark.png">
  <link rel="preload" as="image" href="/img/hero-aqua.jpg">
  <!-- js: CSS hides intro/reveal start states only when JavaScript runs.
       is-loading: entrance animations stay paused until the page loader splits open. -->
  <script>document.documentElement.classList.add('js', 'is-loading')</script>
